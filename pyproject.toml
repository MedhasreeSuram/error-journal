[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "errorjournal"
version = "0.1.0"
description = "Run your code through ej and learn from your own mistakes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
ej = "errorjournal.cli:main"